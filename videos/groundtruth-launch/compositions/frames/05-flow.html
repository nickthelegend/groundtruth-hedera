    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        var CY = "#0dccff";
        var MUTED = "#7a9ab5";

        /* ---- svg-path-draw: measured geometry, never a magic number ---- */
        var rail = document.getElementById("gt05-rail");
        var railLen = 1320;
        if (rail && typeof rail.getTotalLength === "function") {
          railLen = rail.getTotalLength() || 1320;
        }
        rail.style.strokeDasharray = String(railLen);
        rail.style.strokeDashoffset = String(railLen);

        /* ---- motion-blur-streak (Path A): proxy-tweened directional blur ---- */
        var blurNode = document.getElementById("gt05-streak-blur");
        var blurProxy = { v: 0 };
        var writeBlur = function () {
          blurNode.setAttribute("stdDeviation", blurProxy.v + " 0");
        };
        writeBlur(); // seed frame 0 — the dot rests sharp before its first leg

        var PEAK_BLUR = 8;
        var ECHO_STEP = 26;
        var GHOST_BASE = 0.45;

        /* =========================================================
           Scene 1 (0.0–1.3s) — the real page behind, the rail draws
           ========================================================= */
        tl.fromTo(
          "#gt05-shot",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          0,
        );
        tl.fromTo(
          "#gt05-shot-cam",
          { scale: 1.06 },
          { scale: 1, duration: 2.2, ease: "power2.out" },
          0,
        );
        tl.fromTo(
          "#gt05-kicker",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.3,
        );
        tl.to(
          "#gt05-rail",
          { strokeDashoffset: 0, duration: 0.88, ease: "power2.out" },
          0.42,
        );

        /* =========================================================
           Scene 2 (1.3–2.3s) — "The agent signs" · station 1 pops
           ========================================================= */
        tl.fromTo(
          "#gt05-chip-1",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          1.3,
        );
        tl.fromTo(
          "#gt05-label-1",
          { opacity: 0, color: CY },
          { opacity: 1, color: CY, duration: 0.35, ease: "power2.out" },
          1.42,
        );
        tl.fromTo(
          "#gt05-accent-1",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          1.4,
        );
        // the rail makes room for the label as the station lands
        tl.to(
          "#gt05-notch-1",
          { attr: { "fill-opacity": 1 }, duration: 0.3, ease: "power2.out" },
          1.42,
        );
        tl.fromTo(
          "#gt05-ord-1",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          1.62,
        );
        // the value takes shape on station 1
        tl.fromTo(
          "#gt05-dot",
          { scale: 0, opacity: 0, x: 0 },
          { scale: 1, opacity: 1, x: 0, duration: 0.34, ease: "power3.out" },
          1.86,
        );

        /* =========================================================
           Scene 3 (2.3–3.4s) — "Hedera settles" · leg 1 + station 2
           ========================================================= */
        // blur ramps into the burst, then resolves on the same window/ease as position
        tl.to(
          blurProxy,
          { v: PEAK_BLUR, duration: 0.06, ease: "power3.in", onUpdate: writeBlur },
          2.3,
        );
        tl.fromTo(
          "#gt05-dot",
          { x: 0 },
          { x: 540, duration: 0.44, ease: "power3.out", immediateRender: false },
          2.36,
        );
        tl.to(
          blurProxy,
          { v: 0, duration: 0.44, ease: "power3.out", onUpdate: writeBlur },
          2.36,
        );
        [1, 2, 3].forEach(function (i) {
          tl.fromTo(
            "#gt05-ghost-" + i,
            { x: -i * ECHO_STEP, opacity: GHOST_BASE / i },
            {
              x: 540,
              opacity: 0,
              duration: 0.44,
              ease: "power3.out",
              immediateRender: false,
            },
            2.36,
          );
        });

        tl.fromTo(
          "#gt05-chip-2",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          2.44,
        );
        tl.fromTo(
          "#gt05-accent-2",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          2.54,
        );
        tl.fromTo(
          "#gt05-label-2",
          { opacity: 0, color: CY },
          { opacity: 1, color: CY, duration: 0.35, ease: "power2.out" },
          2.56,
        );
        // station 1 hands the voltage on
        tl.to("#gt05-label-1", { color: MUTED, duration: 0.34, ease: "power2.out" }, 2.62);
        tl.to("#gt05-accent-1", { opacity: 0, duration: 0.34, ease: "power2.out" }, 2.62);
        tl.to(
          "#gt05-notch-2",
          { attr: { "fill-opacity": 1 }, duration: 0.3, ease: "power2.out" },
          2.56,
        );
        tl.fromTo(
          "#gt05-ord-2",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          2.8,
        );

        /* =========================================================
           Scene 4 (3.4–5.205s) — leg 2, station 3, flash, HOLD
           ========================================================= */
        tl.to(
          blurProxy,
          { v: PEAK_BLUR, duration: 0.06, ease: "power3.in", onUpdate: writeBlur },
          3.4,
        );
        tl.fromTo(
          "#gt05-dot",
          { x: 540 },
          { x: 1080, duration: 0.46, ease: "power3.out", immediateRender: false },
          3.46,
        );
        tl.to(
          blurProxy,
          { v: 0, duration: 0.46, ease: "power3.out", onUpdate: writeBlur },
          3.46,
        );
        [1, 2, 3].forEach(function (i) {
          tl.fromTo(
            "#gt05-ghost-" + i,
            { x: 540 - i * ECHO_STEP, opacity: GHOST_BASE / i },
            {
              x: 1080,
              opacity: 0,
              duration: 0.46,
              ease: "power3.out",
              immediateRender: false,
            },
            3.46,
          );
        });

        tl.fromTo(
          "#gt05-chip-3",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          3.54,
        );
        tl.fromTo(
          "#gt05-accent-3",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          3.64,
        );
        tl.fromTo(
          "#gt05-label-3",
          { opacity: 0, color: CY },
          { opacity: 1, color: CY, duration: 0.35, ease: "power2.out" },
          3.66,
        );
        tl.to(
          "#gt05-notch-3",
          { attr: { "fill-opacity": 1 }, duration: 0.3, ease: "power2.out" },
          3.66,
        );
        tl.to("#gt05-label-2", { color: MUTED, duration: 0.34, ease: "power2.out" }, 3.72);
        tl.to("#gt05-accent-2", { opacity: 0, duration: 0.34, ease: "power2.out" }, 3.72);

        // arrival: the border flashes once
        tl.fromTo(
          "#gt05-flash-3",
          { opacity: 0 },
          { opacity: 0.85, duration: 0.12, ease: "power2.out" },
          3.92,
        );
        tl.to("#gt05-flash-3", { opacity: 0, duration: 0.42, ease: "power2.out" }, 4.04);

        tl.fromTo(
          "#gt05-ord-3",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          3.98,
        );

        // 4.46 → 5.205 · HOLD. Three stations placed, only the last in cyan,
        // the dot resting sharp on station 3, the rail still.

        window.__timelines["05-flow"] = tl;
      })();
    </script>
