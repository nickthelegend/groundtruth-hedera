  <script>
    (function () {
      var D = 4.309;
      var root = document.querySelector('[data-composition-id="03-the-call"]') || document;
      var q = function (sel) {
        return root.querySelector(sel);
      };

      var grid = q(".f03t-grid");
      var kickerText = q(".f03t-kicker-text");
      var rule = q(".f03t-rule");
      var panel = q(".f03t-panel");
      var methodEl = q(".f03t-method");
      var pathEl = q(".f03t-path");
      var caret = q(".f03t-caret");
      var arrow = q(".f03t-arrow");
      var proto = q(".f03t-proto");
      var code = q(".f03t-code");
      var bloom = q(".f03t-bloom");
      var phrase = q(".f03t-phrase");
      var statusVal = q(".f03t-status-val");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.0–1.4s) — surface slides up 32px, request types on ---------- */

      // ground: a slow settle under everything (macro camera move)
      tl.fromTo(grid, { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 2.0, ease: "power2.out" }, 0);

      // mono chrome
      tl.fromTo(kickerText, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.12);
      tl.fromTo(rule, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.2);

      // the code surface — slides up 32px and settles
      tl.fromTo(panel, { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" }, 0);
      tl.fromTo(arrow, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.3);

      // discrete-text-sequence: keystroke clusters -> pause at the space -> typo -> backspace -> bulk completion.
      // Each entry shows from its t until the NEXT entry's t; [t, method, path].
      var SEQ = [
        [0.0, "", ""],
        [0.44, "G", ""],
        [0.52, "GE", ""],
        [0.6, "GET", ""],
        [0.72, "GET ", ""],
        [0.82, "GET ", "/ap"],
        [0.9, "GET ", "/api"],
        [0.97, "GET ", "/api/v"],
        [1.04, "GET ", "/api/v1"],
        [1.11, "GET ", "/api/v1/h"],
        [1.18, "GET ", "/api/v1/hun"],
        [1.25, "GET ", "/api/v1/hu"],
        [1.31, "GET ", "/api/v1/human-do"]
      ];

      function stateAt(t) {
        for (var i = SEQ.length - 1; i >= 0; i--) {
          if (t >= SEQ[i][0]) return SEQ[i];
        }
        return SEQ[0];
      }

      var RESPONSE_AT = 2.6;

      var drv = { t: 0 };
      tl.to(
        drv,
        {
          t: D,
          duration: D,
          ease: "none",
          onUpdate: function () {
            var s = stateAt(drv.t);
            if (methodEl.textContent !== s[1]) methodEl.textContent = s[1];
            if (pathEl.textContent !== s[2]) pathEl.textContent = s[2];
            var v = drv.t >= RESPONSE_AT + 0.08 ? "received" : "awaiting";
            if (statusVal.textContent !== v) statusVal.textContent = v;
          }
        },
        0
      );

      /* ---------- Scene 2 (1.4–2.6s) — held. Just the caret blinking. ---------- */
      // deterministic sin square wave on the same timeline (one cycle per ~0.72s)
      var blk = { p: 0 };
      tl.to(
        blk,
        {
          p: Math.PI * 2 * 6,
          duration: D,
          ease: "none",
          onUpdate: function () {
            caret.style.opacity = Math.sin(blk.p) > 0 ? "1" : "0";
          }
        },
        0
      );

      /* ---------- Scene 3 (2.6–4.309s) — kinetic-beat-slam response, hold on the 402 ---------- */
      // ONE tempo grid drives every hit.
      var PULSE = 0.13;
      var BEATS = [RESPONSE_AT, RESPONSE_AT + PULSE * 1, RESPONSE_AT + PULSE * 3];

      // the request line above dims out of the way
      tl.to([methodEl, pathEl], { color: "#3A5269", duration: 0.4, ease: "power2.out" }, BEATS[0]);
      tl.to(caret, { backgroundColor: "#3A5269", duration: 0.4, ease: "power2.out" }, BEATS[0]);

      // distinct entrance per phrase — side snap / scale slam / rise+rotate
      tl.fromTo(proto, { x: -56, opacity: 0 }, { x: 0, opacity: 1, duration: 0.36, ease: "expo.out" }, BEATS[0]);
      tl.fromTo(
        code,
        { scale: 1.55, filter: "blur(14px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.44, ease: "power4.out" },
        BEATS[1]
      );
      tl.fromTo(
        phrase,
        { y: 34, rotation: 3, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.44, ease: "circ.out" },
        BEATS[2]
      );

      // one glow bloom on the 402, then it decays
      tl.fromTo(bloom, { opacity: 0, scale: 1.25 }, { opacity: 0.95, scale: 1, duration: 0.2, ease: "power2.out" }, BEATS[1]);
      tl.to(bloom, { opacity: 0, duration: 0.95, ease: "power2.out" }, BEATS[1] + 0.22);

      // the surface briefly takes the accent hairline, then returns
      tl.to(panel, { borderColor: "rgba(13,204,255,0.28)", duration: 0.14, ease: "power2.out" }, BEATS[1]);
      tl.to(panel, { borderColor: "#1C2A3A", duration: 0.95, ease: "power2.out" }, BEATS[1] + 0.16);

      // HOLD on the 402 — a single slow push, no repeat/yoyo
      tl.to(panel, { scale: 1.012, duration: 1.25, ease: "sine.inOut" }, 3.05);

      window.__timelines["03-the-call"] = tl;
    })();
  </script>
