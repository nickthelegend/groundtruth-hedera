  <script>
    (function () {
      var FID = "04-challenge";
      var P = "f04-challenge-";
      var g = function (s) {
        return document.getElementById(P + s);
      };

      var DUR = 7.86;
      var DIM = 0.5;
      var CYAN = "#0DCCFF";
      var MUTED = "#7A9AB5";

      var KEYS = ["scheme", "network", "asset", "fee"];

      /* ── svg-path-draw setup: measured geometry, never a magic number ── */
      KEYS.forEach(function (k) {
        var path = g("barpath-" + k);
        var len = path.getTotalLength() || 29;
        path.style.strokeDasharray = String(len);
        path.style.strokeDashoffset = String(len);
      });

      /* ── typing: split each gloss into per-character spans ── */
      function split(el) {
        var text = el.textContent;
        el.textContent = "";
        var out = [];
        for (var i = 0; i < text.length; i++) {
          var s = document.createElement("span");
          s.textContent = text.charAt(i);
          el.appendChild(s);
          out.push(s);
        }
        return out;
      }
      var chars = {};
      KEYS.forEach(function (k) {
        chars[k] = split(g("gt-" + k));
      });

      var lineTexts = document.querySelectorAll("." + P + "jl-text");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ── macro camera: a slow, continuous drift underneath everything ── */
      tl.fromTo(
        g("grid"),
        { x: 0, y: 0 },
        { x: -26, y: -14, duration: DUR, ease: "none" },
        0
      );
      tl.fromTo(
        g("panel"),
        { y: 0 },
        { y: -7, duration: DUR, ease: "none" },
        0
      );

      /* ══ Scene 1 (0.0–1.1s) — the real challenge body fades up, complete and dim ══ */
      tl.fromTo(
        g("panel"),
        { opacity: 0 },
        { opacity: 1, duration: 0.40, ease: "power2.out" },
        0
      );
      tl.fromTo(
        lineTexts,
        { opacity: 0, y: 10 },
        {
          opacity: DIM,
          y: 0,
          duration: 0.46,
          ease: "power2.out",
          stagger: 0.018,
        },
        0.10
      );
      tl.fromTo(
        g("rule-top"),
        { opacity: 1, scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        0.34
      );
      tl.fromTo(
        g("eyebrow"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power2.out" },
        0.46
      );
      tl.fromTo(
        g("rule-bot"),
        { opacity: 1, scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        0.52
      );
      tl.fromTo(
        g("foot"),
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.40, ease: "power2.out" },
        0.66
      );

      /* ══ Scenes 2–5 — four cause→effect couplets, one per spoken cue ══
         cause: the VO names a field → that line lifts, a cyan hairline draws
                down its left edge (svg-path-draw)
         effect: the plain-English gloss types into the right rail            */
      var STEPS = [
        { k: "scheme", lift: 1.06, gloss: 1.16, type: 1.28, typeDur: 0.42 },
        { k: "network", lift: 2.95, gloss: 3.01, type: 3.13, typeDur: 0.34 },
        { k: "asset", lift: 4.14, gloss: 4.20, type: 4.32, typeDur: 0.26 },
        { k: "fee", lift: 4.90, gloss: 5.00, type: 5.14, typeDur: 0.88 },
      ];
      var RELEASE = [2.83, 4.02, 4.78];
      var GLOSS_OUT = [2.79, 3.98, 4.74];

      STEPS.forEach(function (s, i) {
        /* release the previous highlight first — only ONE cyan at a time */
        if (i > 0) {
          var prev = STEPS[i - 1].k;
          var rAt = RELEASE[i - 1];
          tl.to(
            g("t-" + prev),
            { opacity: DIM, duration: 0.26, ease: "power1.inOut" },
            rAt
          );
          tl.to(
            g("v-" + prev),
            { color: MUTED, duration: 0.26, ease: "power1.inOut" },
            rAt
          );
          tl.to(
            g("hair-" + prev),
            { opacity: 0, duration: 0.22, ease: "power1.in" },
            rAt
          );
          /* the rail gloss cuts out just ahead of the next one */
          tl.to(
            g("g-" + prev),
            { opacity: 0, y: -14, duration: 0.18, ease: "power1.in" },
            GLOSS_OUT[i - 1]
          );
        }

        /* cause — the line lifts to full white with a cyan hairline drawn down its left edge */
        tl.to(
          g("barpath-" + s.k),
          { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" },
          s.lift - 0.02
        );
        tl.fromTo(
          g("hair-" + s.k),
          { opacity: 1 },
          { opacity: 1, duration: 0.01, ease: "none" },
          s.lift - 0.02
        );
        tl.to(
          g("t-" + s.k),
          { opacity: 1, duration: 0.28, ease: "power2.out" },
          s.lift
        );
        /* the VALUE takes the cyan, not the key */
        tl.to(
          g("v-" + s.k),
          { color: CYAN, duration: 0.30, ease: "power1.out" },
          s.lift + 0.04
        );

        /* effect — the gloss types into the rail */
        tl.fromTo(
          g("g-" + s.k),
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" },
          s.gloss
        );
        tl.fromTo(
          chars[s.k],
          { opacity: 0 },
          {
            opacity: 1,
            duration: 0.05,
            ease: "none",
            stagger: s.typeDur / chars[s.k].length,
          },
          s.type
        );
      });

      /* ══ Scene 5 payoff — a single ambient-glow-bloom behind the feePayer line,
            landing with the line's settle, then decaying and holding lit ══ */
      tl.fromTo(
        g("glow"),
        { opacity: 0, scale: 0.86 },
        { opacity: 0.3, scale: 1, duration: 0.62, ease: "power2.out" },
        4.82
      );
      tl.to(
        g("glow"),
        { opacity: 0.15, duration: 1.05, ease: "power1.out" },
        5.46
      );

      window.__timelines[FID] = tl;
    })();
