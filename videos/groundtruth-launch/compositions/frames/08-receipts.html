    <script>
      (function () {
        var FRAME = "08-receipts";
        var root = document.querySelector('[data-composition-id="' + FRAME + '"]');
        if (!root || !window.gsap) return;
        var all = function (sel) {
          return Array.prototype.slice.call(root.querySelectorAll(sel));
        };
        var one = function (sel) {
          return root.querySelector(sel);
        };

        var INK = "#EDF2F7";
        var MUTED = "#7A9AB5";
        var FAINT = "#3A5269";
        var LINE = "#1C2A3A";
        var CYAN = "#0DCCFF";

        var rows = all(".rcpt08-row");
        var rules = all("[data-rule]");
        var bars = all("[data-bar]");
        var labels = all("[data-label]");
        var ids = all("[data-id]");
        var ticks = all("[data-tick]");

        // svg-path-draw setup — measured geometry, never a magic number
        var tickLen = ticks.map(function (p) {
          var len = p.getTotalLength();
          // long gap + a 6-unit offset pad parks the whole path (and the round
          // linecap that would otherwise leave a dot) outside the visible dash
          var start = len + 6;
          p.style.strokeDasharray = len + " " + (len + 30);
          p.style.strokeDashoffset = String(start);
          return start;
        });

        // monospace character reveal — the id types on one glyph at a time
        var idChars = ids.map(function (el) {
          return el.textContent.length;
        });

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // ── macro camera underneath: the live stats page settles, then holds ──
        tl.fromTo(
          one("#rcpt08-shot"),
          { scale: 1.08 },
          { scale: 1, duration: 5.4, ease: "power1.out" },
          0,
        );

        // ── Scene 1 (0.0–1.4s) · three empty hairline rows draw on, stacked centre ──
        tl.fromTo(
          one("#rcpt08-rows"),
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          0.0,
        );
        [0.06, 0.24, 0.42].forEach(function (at, i) {
          tl.fromTo(
            rules[i],
            { scaleX: 0 },
            {
              scaleX: 1,
              duration: 0.58,
              ease: "power2.out",
              transformOrigin: "left center",
            },
            at,
          );
        });
        // bars stay dark + collapsed until their row is the active one
        bars.forEach(function (b) {
          tl.set(b, { scaleY: 0, transformOrigin: "top center" }, 0);
        });

        // ── row fill: bar → label → typed id → tick ──
        function fillRow(i, at) {
          tl.fromTo(
            bars[i],
            { scaleY: 0, backgroundColor: CYAN },
            {
              scaleY: 1,
              duration: 0.28,
              ease: "power2.out",
              transformOrigin: "top center",
              immediateRender: false,
            },
            at,
          );
          tl.fromTo(
            labels[i],
            { opacity: 0, x: -12 },
            { opacity: 1, x: 0, duration: 0.32, ease: "power2.out" },
            at + 0.06,
          );
          var n = idChars[i];
          var typeDur = i === 2 ? 0.46 : 0.62;
          tl.fromTo(
            ids[i],
            { width: "0ch" },
            {
              width: n + "ch",
              duration: typeDur,
              ease: "steps(" + n + ")",
            },
            at + 0.26,
          );
          tl.fromTo(
            ticks[i],
            { strokeDashoffset: tickLen[i] },
            { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
            at + 0.26 + typeDur + 0.02,
          );
        }
        // previous row's accent bar drops to the hairline; its green tick stays
        function coolBar(i, at) {
          tl.fromTo(
            bars[i],
            { backgroundColor: CYAN },
            {
              backgroundColor: LINE,
              duration: 0.35,
              ease: "power1.out",
              immediateRender: false,
            },
            at,
          );
        }

        // Scene 2 (1.4–2.6s) · "Payment."
        fillRow(0, 1.4);
        // Scene 3 (2.6–3.8s) · "Payout."
        coolBar(0, 2.66);
        fillRow(1, 2.7);
        // Scene 4 (3.8–5.4s) · "Proof anchored to consensus."
        coolBar(1, 3.96);
        fillRow(2, 4.0);

        // ── Scene 5 (5.4–7.4s) · rows compress upward + dim; 0 → 243 dead-centre ──
        tl.fromTo(
          one("#rcpt08-rows"),
          { y: 0, scale: 1 },
          {
            y: -192,
            scale: 0.84,
            duration: 0.85,
            ease: "power2.inOut",
            transformOrigin: "50% 0%",
            immediateRender: false,
          },
          5.42,
        );
        coolBar(2, 5.42);
        labels.forEach(function (el) {
          tl.fromTo(
            el,
            { color: MUTED },
            { color: FAINT, duration: 0.6, ease: "power1.out", immediateRender: false },
            5.42,
          );
        });
        ids.forEach(function (el) {
          tl.fromTo(
            el,
            { color: INK },
            { color: FAINT, duration: 0.6, ease: "power1.out", immediateRender: false },
            5.42,
          );
        });
        rules.forEach(function (el) {
          tl.fromTo(
            el,
            { backgroundColor: "#274056" },
            {
              backgroundColor: LINE,
              duration: 0.6,
              ease: "power1.out",
              immediateRender: false,
            },
            5.42,
          );
        });

        tl.fromTo(
          one("#rcpt08-divider"),
          { scaleX: 0, opacity: 0 },
          {
            scaleX: 1,
            opacity: 1,
            duration: 0.7,
            ease: "power2.out",
            transformOrigin: "left center",
          },
          5.62,
        );

        tl.fromTo(
          one("#rcpt08-stat-main"),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          5.78,
        );

        // count-up — deterministic proxy, rounded per frame
        var mainEl = one("#rcpt08-num-main");
        var mainVal = { v: 0 };
        mainEl.textContent = "0";
        tl.fromTo(
          mainVal,
          { v: 0 },
          {
            v: 243,
            duration: 1.25,
            ease: "power2.out",
            onUpdate: function () {
              mainEl.textContent = String(Math.round(mainVal.v));
            },
          },
          5.9,
        );

        tl.fromTo(
          one("#rcpt08-cap-main"),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" },
          7.0,
        );

        // ── Scene 6 (7.4s → end) · the chaser: 0 → 111 beside it, then HOLD ──
        tl.fromTo(
          one("#rcpt08-stat-sub"),
          { opacity: 0, x: 20 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
          7.42,
        );

        var subEl = one("#rcpt08-num-sub");
        var subVal = { v: 0 };
        subEl.textContent = "0";
        tl.fromTo(
          subVal,
          { v: 0 },
          {
            v: 111,
            duration: 1.05,
            ease: "power2.out",
            onUpdate: function () {
              subEl.textContent = String(Math.round(subVal.v));
            },
          },
          7.52,
        );

        tl.fromTo(
          one("#rcpt08-cap-sub"),
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" },
          8.35,
        );
        // 8.75 → end · dead still. No drift, no push.

        window.__timelines[FRAME] = tl;
      })();
    </script>
