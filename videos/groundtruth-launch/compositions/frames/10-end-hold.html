    /* inner element carries the animated opacity so the .clip wrapper's own

    <div

    <!-- track 2 — the brand mark, inlined from assets/logo-d52442ef.svg -->
    <div class="clip f10-end-hold-mark" data-start="0" data-duration="5" data-track-index="2">

    <div class="clip f10-end-hold-url" data-start="0" data-duration="5" data-track-index="4">
      groundtruth-hedera.vercel.app<span class="f10-end-hold-caret"></span>

    <!-- track 5 — network chip -->
    <div class="clip f10-end-hold-chip" data-start="0" data-duration="5" data-track-index="5">

  <script>
    (function () {
      var SCOPE = '[data-composition-id="10-end-hold"] ';
      var DOTS = SCOPE + ".f10-end-hold-dots";
      var CARET = SCOPE + ".f10-end-hold-caret";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–5.0s) — pure hold. Nothing enters, repositions, or scales.

      // (1) the dot grid eases down ~30% across the whole 5s, so the frame
      //     quietly darkens toward the cut.
      tl.fromTo(
        DOTS,
        { opacity: 1 },
        { opacity: 0.7, duration: 5, ease: "power1.inOut" },
        0
      );

      // (2) a mono caret blinks at the end of the URL on a 1.1s cadence
      //     (0.55s on / 0.55s off), matching Frame 1's caret. Authored as
      //     explicit fromTo steps so every seek is deterministic — no repeat,
      //     no yoyo, no timers.
      var HALF = 0.55;
      var DUR = 5;
      tl.set(CARET, { opacity: 1 }, 0);
      for (var i = 1; i * HALF < DUR; i++) {
        var lit = i % 2 === 0; // odd flip -> off, even flip -> back on
        tl.fromTo(
          CARET,
          { opacity: lit ? 0 : 1 },
          {
            opacity: lit ? 1 : 0,
            duration: 0.001,
            ease: "none",
            immediateRender: false,
          },
          i * HALF
        );
      }

      window.__timelines["10-end-hold"] = tl;
    })();
  </script>
